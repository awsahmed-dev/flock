<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Chat screen preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a1a"/>
      <stop offset="100%" stop-color="#1f1535"/>
    </linearGradient>
    <linearGradient id="mine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="360" height="780" fill="url(#bg)"/>
  <!-- header -->
  <rect x="16" y="20" width="328" height="52" rx="14" fill="#fff" opacity="0.06"/>
  <circle cx="42" cy="46" r="14" fill="#6366f1" opacity="0.6"/>
  <text x="42" y="51" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">P</text>
  <text x="68" y="42" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Chat</text>
  <text x="68" y="58" font-family="sans-serif" font-size="10" fill="#fff" opacity="0.5">Tulum trip · 4 online</text>
  <!-- messages -->
  <circle cx="32" cy="116" r="12" fill="#22c55e" opacity="0.7"/>
  <text x="32" y="120" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">M</text>
  <rect x="50" y="100" width="190" height="36" rx="14" fill="#fff" opacity="0.08"/>
  <text x="62" y="124" font-family="sans-serif" font-size="11" fill="#fff">Anyone down for tacos at 8?</text>

  <rect x="120" y="146" width="224" height="36" rx="14" fill="url(#mine)"/>
  <text x="132" y="170" font-family="sans-serif" font-size="11" fill="#fff">yes! sending location now ✈️</text>

  <!-- ai chips -->
  <rect x="120" y="194" width="100" height="22" rx="11" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="1"/>
  <text x="170" y="208" font-family="sans-serif" font-size="9" font-weight="700" fill="#6366f1" text-anchor="middle">✨ Add to plan</text>
  <rect x="226" y="194" width="100" height="22" rx="11" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="1"/>
  <text x="276" y="208" font-family="sans-serif" font-size="9" font-weight="700" fill="#6366f1" text-anchor="middle">💸 Log expense</text>

  <!-- vote card -->
  <circle cx="32" cy="266" r="12" fill="#a855f7" opacity="0.7"/>
  <rect x="50" y="240" width="294" height="100" rx="14" fill="#fff" opacity="0.06"/>
  <text x="62" y="262" font-family="sans-serif" font-size="9" font-weight="700" fill="#a855f7">📊 NEW VOTE</text>
  <text x="62" y="282" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">Pizza or sushi for dinner?</text>
  <rect x="62" y="294" width="100" height="22" rx="6" fill="#fff" opacity="0.08"/>
  <text x="112" y="308" font-family="sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">🍕 Pizza</text>
  <rect x="170" y="294" width="100" height="22" rx="6" fill="#fff" opacity="0.08"/>
  <text x="220" y="308" font-family="sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">🍣 Sushi</text>

  <!-- input -->
  <rect x="16" y="710" width="328" height="44" rx="22" fill="#fff" opacity="0.08"/>
  <text x="32" y="736" font-family="sans-serif" font-size="11" fill="#fff" opacity="0.4">Message the crew…</text>
  <circle cx="318" cy="732" r="14" fill="#6366f1"/>
</svg>
