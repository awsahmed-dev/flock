<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Vote screen preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a1a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="360" height="780" fill="url(#bg)"/>
  <!-- top bar -->
  <rect x="16" y="20" width="80" height="14" rx="4" fill="#fff" opacity="0.85"/>
  <!-- vote card -->
  <rect x="16" y="60" width="328" height="240" rx="20" fill="#fff" opacity="0.08"/>
  <text x="32" y="92" font-family="sans-serif" font-size="11" font-weight="700" fill="#a855f7">📊 OPEN VOTE</text>
  <text x="32" y="118" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Which Airbnb should we pick?</text>
  <!-- option 1 (winning) -->
  <rect x="32" y="138" width="296" height="44" rx="10" fill="#6366f1" opacity="0.35"/>
  <rect x="32" y="138" width="220" height="44" rx="10" fill="#6366f1" opacity="0.55"/>
  <text x="44" y="166" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff">Beachfront 3BR · $480/n</text>
  <text x="298" y="166" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="end">4</text>
  <!-- option 2 -->
  <rect x="32" y="190" width="296" height="44" rx="10" fill="#fff" opacity="0.08"/>
  <rect x="32" y="190" width="80" height="44" rx="10" fill="#fff" opacity="0.15"/>
  <text x="44" y="218" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff">Mountain cabin · $320/n</text>
  <text x="298" y="218" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" opacity="0.6" text-anchor="end">1</text>
  <!-- option 3 -->
  <rect x="32" y="242" width="296" height="44" rx="10" fill="#fff" opacity="0.08"/>
  <text x="44" y="270" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff">Boutique hotel · $620/n</text>
  <text x="298" y="270" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" opacity="0.4" text-anchor="end">0</text>
  <!-- second vote -->
  <text x="16" y="338" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" opacity="0.5">RESOLVED · 3 DAYS AGO</text>
  <rect x="16" y="354" width="328" height="120" rx="20" fill="#fff" opacity="0.06"/>
  <text x="32" y="384" font-family="sans-serif" font-size="14" font-weight="600" fill="#fff">Best taco spot in Mexico City?</text>
  <rect x="32" y="402" width="200" height="34" rx="8" fill="#22c55e" opacity="0.25"/>
  <text x="44" y="424" font-family="sans-serif" font-size="12" font-weight="700" fill="#22c55e">🏆 El Vilsito</text>
  <text x="244" y="424" font-family="sans-serif" font-size="11" font-weight="600" fill="#fff" opacity="0.7">5/6 votes</text>
</svg>
